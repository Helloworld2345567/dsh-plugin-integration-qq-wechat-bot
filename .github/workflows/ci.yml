name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  HARNESS_VERSION: '0.2.1-rc.5'

jobs:
  quality:
    name: 纯逻辑与依赖门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-voice-generation-ci.txt
            requirements-audit-ci.txt

      - name: 确认 FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            echo 'FFmpeg is unavailable on this quality runner; media unit tests use fixtures.'
          fi

      - name: 安装可复现依赖
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          python -m pip install -r requirements-ci.txt -r requirements-voice-generation-ci.txt
          python -m pip install -r requirements-audit-ci.txt

      - name: 检查架构
        run: npm run check:architecture

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: TypeScript 测试
        run: npm test

      - name: Python 测试
        run: npm run test:python

      - name: Python 依赖检查
        run: npm run check:python-dependencies

      - name: 文档检查
        run: npm run check:docs

      - name: 契约检查
        run: npm run check:contracts

      - name: 许可证检查
        run: npm run check:licenses

      - name: 发布内容检查
        run: npm run check:release

      - name: 运行依赖审计
        run: |
          npm run audit:dependencies
          pip-audit -r requirements.txt -r requirements-voice-generation.txt --format json > pip-audit.json
          pip-licenses --from=mixed --format=json > pip-licenses.json

      - name: 上传审计证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            pip-audit.json
            pip-licenses.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传失败测试证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-test-evidence-${{ github.run_id }}
          path: .codex/**/*-evidence/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  release-gate:
    name: Windows 发布门禁
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-voice-generation-ci.txt
            requirements-audit-ci.txt

      - name: 确认 FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: 安装可复现依赖
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          python -m pip install -r requirements-ci.txt -r requirements-voice-generation-ci.txt

      - name: 运行只读环境预检
        run: npm run check:environment

      - name: 执行发布门禁并生成临时归档
        run: npm run release:pack

      - name: 运行依赖审计
        run: npm run audit:dependencies

  harness-integration:
    name: Harness 集成与安装验收
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 安装 pnpm
        shell: pwsh
        run: |
          npm install --global pnpm@12.16.1
          pnpm --version

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-voice-generation-ci.txt
            requirements-audit-ci.txt

      - name: 确认 FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: 安装可复现依赖
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          python -m pip install -r requirements-ci.txt -r requirements-voice-generation-ci.txt

      - name: 运行只读环境预检
        run: npm run check:environment

      - name: 运行 Harness 原生集成测试
        shell: pwsh
        run: |
          $env:BOT_TEST_PYTHON = (Get-Command python).Source
          npm run test:native
          npm run test:lifecycle-native

      - name: 运行独立产品安装验收
        shell: pwsh
        run: |
          $env:BOT_TEST_PYTHON = (Get-Command python).Source
          npm run test:install-smoke

      - name: 上传失败集成证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-test-evidence-${{ github.run_id }}
          path: .codex/**/*-evidence/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  python-compatibility:
    name: Python ${{ matrix.python-version }} 依赖检查
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-voice-generation-ci.txt
            requirements-audit-ci.txt
      - name: 安装并检查 Python 依赖
        run: |
          python -m pip install -r requirements-ci.txt -r requirements-voice-generation-ci.txt
          python -m pip check
