name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Linux 发布门禁与依赖审计
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*-ci.txt

      - name: 安装可复现依赖
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements-ci.txt -r requirements-voice-generation-ci.txt -r requirements-audit-ci.txt

      - name: 执行源码发布门禁
        run: npm run verify:release

      - name: 运行依赖审计
        run: |
          npm run audit:dependencies
          pip-audit -r requirements.txt -r requirements-voice-generation.txt --format json > pip-audit.json
          pip-licenses --from=mixed --format=json > pip-licenses.json

      - name: 上传审计证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            pip-audit.json
            pip-licenses.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传失败测试证据
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-test-evidence-${{ github.run_id }}
          path: .codex/**/*-evidence/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  release-gate:
    name: Windows 发布与集成验收
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-voice-generation-ci.txt

      - name: 安装 FFmpeg
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: 安装 Node 依赖
        run: npm ci --ignore-scripts

      - name: 安装 pnpm
        run: npm install --global pnpm@12.16.1

      - name: 安装 Python 依赖
        run: python -m pip install -r requirements-ci.txt -r requirements-voice-generation-ci.txt

      - name: 执行发布门禁并验证临时归档
        run: npm run release:pack

      - name: 运行 Harness 原生集成测试
        env:
          BOT_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:native

      - name: 运行 lifecycle 原生集成测试
        env:
          BOT_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:lifecycle-native

      - name: 运行独立产品安装验收
        env:
          BOT_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:install-smoke

      - name: 上传失败测试证据
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-evidence-${{ github.run_id }}
          path: .codex/**/*-evidence/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  python-compatibility:
    name: Python 3.13 依赖检查
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-voice-generation-ci.txt
      - name: 安装 Python 依赖
        run: python -m pip install -r requirements-ci.txt -r requirements-voice-generation-ci.txt
      - name: 检查依赖兼容性
        run: python -m pip check
